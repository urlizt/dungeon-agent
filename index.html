<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11130f">
    <meta
      name="description"
      content="A mobile-first learning game about keeping AI agents safe."
    >
    <title>The Agent's Dungeon</title>
    <link rel="icon" href="assets/favicon-placeholder.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/questions.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/game.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="welcome" aria-labelledby="game-title">
        <img
          class="welcome__logo"
          src="assets/logo-placeholder.svg"
          alt=""
          width="96"
          height="96"
        >
        <p class="eyebrow">A game about safer AI</p>
        <h1 id="game-title">The Agent's Dungeon</h1>
        <p class="welcome__description">
          A story-driven adventure about protecting an AI assistant and the
          secrets entrusted to it.
        </p>
        <p class="setup-note">The dungeon is being prepared.</p>
      </section>
    </main>
  </body>
</html>
